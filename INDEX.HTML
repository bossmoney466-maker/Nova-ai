<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #02030a;
    color: white;
    height: 100vh;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% -10%,
            #263b8f 0%,
            #090d24 35%,
            #02030a 75%
        );

    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0, 220, 255, .035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 220, 255, .035) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    z-index: -1;
}

/* HEADER */

header {
    height: 78px;
    display: flex;
    align-items: center;
    padding: 0 18px;

    background: rgba(3, 5, 15, .75);

    border-bottom:
        1px solid rgba(255,255,255,.1);

    backdrop-filter: blur(20px);
}

.logo {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #715cff,
            #00e5ff
        );

    box-shadow:
        0 0 20px rgba(0,220,255,.7),
        0 0 50px rgba(90,70,255,.25);

    font-size: 23px;
    font-weight: bold;
}

.title {
    margin-left: 13px;
}

.title h1 {
    font-size: 21px;
    letter-spacing: 4px;
}

.title p {
    margin-top: 5px;

    font-size: 9px;

    letter-spacing: 2px;

    color: #71eaff;
}

/* CHAT */

#chat {
    height: calc(100vh - 155px);

    overflow-y: auto;

    padding:
        25px
        15px
        30px;
}

.message {
    max-width: 85%;

    padding:
        15px 17px;

    margin-bottom: 18px;

    border-radius: 19px;

    font-size: 15px;

    line-height: 1.55;

    white-space: pre-wrap;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.ai {
    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.12);

    border-bottom-left-radius: 5px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.2);
}

.user {
    margin-left: auto;

    background:
        linear-gradient(
            135deg,
            #6757ec,
            #267cff
        );

    border-bottom-right-radius: 5px;

    box-shadow:
        0 8px 25px
        rgba(60,100,255,.25);
}

/* INPUT */

.input-area {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    padding: 12px;

    background:
        rgba(2,4,12,.9);

    border-top:
        1px solid rgba(255,255,255,.1);

    backdrop-filter:
        blur(20px);
}

.input-box {
    max-width: 850px;

    margin: auto;

    display: flex;

    gap: 8px;
}

#userInput {
    flex: 1;

    min-width: 0;

    padding: 16px;

    border-radius: 17px;

    border:
        1px solid rgba(255,255,255,.14);

    outline: none;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 15px;

    transition: .25s;
}

#userInput:focus {
    border-color: #00d9ff;

    box-shadow:
        0 0 20px
        rgba(0,217,255,.12);
}

#userInput::placeholder {
    color: #858ca5;
}

button {
    width: 55px;

    border: none;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #6d5cf0,
            #00d9ff
        );

    color: white;

    font-size: 21px;

    cursor: pointer;

    transition: .2s;
}

button:active {
    transform: scale(.93);
}

/* MOBILE */

@media(max-width:600px) {

    .message {
        max-width: 90%;
    }

    .title h1 {
        font-size: 19px;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        N
    </div>

    <div class="title">

        <h1>NOVA AI</h1>

        <p>
            NEXT-GENERATION INTELLIGENCE
        </p>

    </div>

</header>


<div id="chat">

    <div class="message ai">

Hello! I'm NOVA AI 🤖

Your next-generation AI assistant is coming online.

Ask me anything.

    </div>

</div>


<div class="input-area">

    <div class="input-box">

        <input
            id="userInput"
            type="text"
            placeholder="Ask NOVA anything..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

const input =
    document.getElementById("userInput");

const chat =
    document.getElementById("chat");


async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) return;


    /* USER MESSAGE */

    const userMessage =
        document.createElement("div");

    userMessage.className =
        "message user";

    userMessage.textContent =
        text;

    chat.appendChild(
        userMessage
    );

    input.value = "";

    chat.scrollTop =
        chat.scrollHeight;


    /* LOADING */

    const loading =
        document.createElement("div");

    loading.className =
        "message ai";

    loading.textContent =
        "NOVA is thinking... 🤖";

    chat.appendChild(
        loading
    );

    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        const data =
            await response.json();


        loading.remove();


        /* AI RESPONSE */

        const aiMessage =
            document.createElement("div");

        aiMessage.className =
            "message ai";


        if (data.answer) {

            aiMessage.textContent =
                data.answer;

        } else {

            aiMessage.textContent =
                data.error ||
                "Sorry, NOVA couldn't answer right now.";

        }


        chat.appendChild(
            aiMessage
        );

        chat.scrollTop =
            chat.scrollHeight;


    } catch (error) {

        loading.remove();


        const errorMessage =
            document.createElement("div");

        errorMessage.className =
            "message ai";

        errorMessage.textContent =
            "Connection error. NOVA's server isn't connected yet.";

        chat.appendChild(
            errorMessage
        );

        chat.scrollTop =
            chat.scrollHeight;

        console.error(error);

    }

}


/* ENTER KEY */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>
